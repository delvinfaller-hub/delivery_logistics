{% extends "templates/web.html" %}
{% block page_content %}
<style>
  .dt-card{border:1px solid var(--border-color,#ddd);border-radius:10px;padding:12px;margin-bottom:12px}
  .dt-stop{border-top:1px solid var(--border-color,#eee);padding:10px 0}
  .dt-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .dt-btns .btn{flex:1 1 auto}
  .dt-badge{font-size:12px;padding:2px 8px;border-radius:10px;background:#eee}
  .dt-panel{border:1px solid #bbb;border-radius:8px;padding:10px;margin-top:8px}
  #dt-sig{border:1px dashed #888;border-radius:6px;width:100%;height:140px;touch-action:none;background:#fff}
</style>
<div class="container" style="max-width:640px">
  <h3>{{ _("My Deliveries") }}</h3>
  <div id="dt-root"><p class="text-muted">Loading...</p></div>
</div>
<script>
(function () {
  var reasons = [];
  var root = document.getElementById("dt-root");

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function btn(label, cls, fn) {
    var b = el("button", "btn btn-sm " + cls, label);
    b.type = "button"; b.onclick = fn; return b;
  }
  function geo() {
    return new Promise(function (res) {
      if (!navigator.geolocation) return res({});
      navigator.geolocation.getCurrentPosition(
        function (p) { res({latitude: p.coords.latitude, longitude: p.coords.longitude}); },
        function () { res({}); }, {timeout: 8000, enableHighAccuracy: true});
    });
  }
  function call(method, args) {
    return geo().then(function (g) {
      return frappe.call({method: "delivery_logistics.api." + method, args: Object.assign(g, args)});
    }).then(load);
  }
  function resize(file, max) {
    return new Promise(function (res) {
      var img = new Image();
      img.onload = function () {
        var s = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement("canvas");
        c.width = img.width * s; c.height = img.height * s;
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.7));
      };
      img.src = URL.createObjectURL(file);
    });
  }

  function deliverPanel(trip, stop, host) {
    host.innerHTML = "";
    var p = el("div", "dt-panel");
    var name = el("input", "form-control"); name.placeholder = "Received by";
    var remarks = el("input", "form-control"); remarks.placeholder = "Remarks (optional)";
    remarks.style.marginTop = "6px";
    var canvas = el("canvas"); canvas.id = "dt-sig"; canvas.width = 600; canvas.height = 280;
    var ctx = canvas.getContext("2d"), drawing = false, signed = false;
    function pos(e) { var r = canvas.getBoundingClientRect();
      return [(e.clientX - r.left) * canvas.width / r.width, (e.clientY - r.top) * canvas.height / r.height]; }
    canvas.onpointerdown = function (e) { drawing = true; signed = true; ctx.beginPath(); var q = pos(e); ctx.moveTo(q[0], q[1]); };
    canvas.onpointermove = function (e) { if (!drawing) return; var q = pos(e); ctx.lineWidth = 3; ctx.lineTo(q[0], q[1]); ctx.stroke(); };
    canvas.onpointerup = canvas.onpointerleave = function () { drawing = false; };
    var photo = el("input", "form-control"); photo.type = "file"; photo.accept = "image/*";
    photo.setAttribute("capture", "environment"); photo.style.marginTop = "6px";
    var row = el("div", "dt-btns");
    row.appendChild(btn("Clear signature", "btn-default", function () { ctx.clearRect(0, 0, canvas.width, canvas.height); signed = false; }));
    row.appendChild(btn("Confirm delivery", "btn-success", function () {
      if (!name.value.trim()) { frappe.msgprint("Please enter who received the delivery."); return; }
      var f = photo.files[0];
      (f ? resize(f, 1280) : Promise.resolve(null)).then(function (img) {
        call("mark_delivered", {trip: trip, stop: stop, receiver_name: name.value, remarks: remarks.value,
          signature: signed ? canvas.toDataURL("image/png") : null, photo: img});
      });
    }));
    row.appendChild(btn("Cancel", "btn-default", function () { host.innerHTML = ""; }));
    [name, remarks, canvas, photo, row].forEach(function (x) { p.appendChild(x); });
    host.appendChild(p);
  }

  function failPanel(trip, stop, host) {
    host.innerHTML = "";
    var p = el("div", "dt-panel");
    var sel = el("select", "form-control");
    reasons.forEach(function (r) { var o = el("option", "", r.name); o.value = r.name; sel.appendChild(o); });
    var remarks = el("input", "form-control"); remarks.placeholder = "Remarks (optional)";
    remarks.style.marginTop = "6px";
    var re = el("label", "", " Reschedule"); var cb = el("input"); cb.type = "checkbox"; re.prepend(cb);
    var row = el("div", "dt-btns");
    row.appendChild(btn("Submit", "btn-danger", function () {
      call("mark_failed", {trip: trip, stop: stop, reason: sel.value, remarks: remarks.value, reschedule: cb.checked ? 1 : 0});
    }));
    row.appendChild(btn("Cancel", "btn-default", function () { host.innerHTML = ""; }));
    [sel, remarks, re, row].forEach(function (x) { p.appendChild(x); });
    host.appendChild(p);
  }

  function render(trips) {
    root.innerHTML = "";
    if (!trips.length) { root.appendChild(el("p", "text-muted", "No deliveries scheduled for today.")); return; }
    trips.forEach(function (t) {
      var card = el("div", "dt-card");
      card.appendChild(el("h5", "", t.name + " · " + t.status));
      card.appendChild(el("div", "text-muted", [t.driver_name, t.vehicle].filter(Boolean).join(" · ")));
      t.stops.forEach(function (s) {
        var box = el("div", "dt-stop");
        var head = el("div");
        head.appendChild(el("strong", "", s.idx + ". " + (s.customer || "")));
        var bd = el("span", "dt-badge", " " + (s.custom_stop_status || "Pending")); bd.style.marginLeft = "8px";
        head.appendChild(bd);
        box.appendChild(head);
        box.appendChild(el("div", "text-muted", s.address || ""));
        var info = [];
        if (s.estimated_arrival) info.push("ETA " + s.estimated_arrival);
        if (s.delivery_note) info.push(s.delivery_note);
        if (s.grand_total) info.push(format_currency(s.grand_total));
        box.appendChild(el("div", "text-muted", info.join(" · ")));
        var host = el("div");
        var done = ["Delivered", "Failed", "Rescheduled"].indexOf(s.custom_stop_status) >= 0;
        if (!done) {
          var row = el("div", "dt-btns");
          var nav = el("a", "btn btn-sm btn-default", "Navigate");
          nav.target = "_blank";
          nav.href = "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(s.address || s.customer);
          row.appendChild(nav);
          row.appendChild(btn("Arrived", "btn-default", function () { call("mark_arrived", {trip: t.name, stop: s.name}); }));
          row.appendChild(btn("Delivered", "btn-success", function () { deliverPanel(t.name, s.name, host); }));
          row.appendChild(btn("Failed", "btn-danger", function () { failPanel(t.name, s.name, host); }));
          box.appendChild(row);
        }
        box.appendChild(host);
        card.appendChild(box);
      });
      root.appendChild(card);
    });
  }

  function load() {
    return frappe.call({method: "delivery_logistics.api.get_my_trips"}).then(function (r) { render(r.message || []); });
  }
  frappe.call({method: "delivery_logistics.api.get_failure_reasons"}).then(function (r) { reasons = r.message || []; load(); });
})();
</script>
{% endblock %}
